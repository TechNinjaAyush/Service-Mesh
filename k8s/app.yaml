apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: service-mesh
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/TechNinjaAyush/Service-Mesh                                      
    targetRevision: main
    path: k8s
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 