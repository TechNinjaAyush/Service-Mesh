version: "3.9"

services:
  service-mesh:
    image: service-mesh-new:v1.2.3
    container_name: service-mesh-new

    volumes:
      - ~/.kube/config:/root/.kube/config:ro

    env_file:
      - .env

    ports:
      - "8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - kind

    depends_on:
      - nats

  nats:
    image: nats:latest
    container_name: nats-server-new

    command:
      - "-js"
      - "--store_dir=/data"

    ports:
      - "4222:4222"
      - "8222:8222"

    volumes:
      - nats_data:/data

    networks:
      - kind

  memory-engine:
    image: memory-engine:v1.1.4
    container_name: memory-engine-new

    ports:
      - "3000:3000"

    depends_on:
      - neo4j

    networks:
      - kind 

    environment:
        NEO4J_URI: "bolt://neo4j:7687"
        NEO4J_USERNAME: "neo4j"
        NEO4J_PASSWORD: "your_password"
        NATS_URL: "nats://nats:4222" 

  neo4j:
    image: neo4j:latest
    container_name: neo4j

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/your_password

    volumes:
      - neo4j_data:/data

    networks:
      - kind

  rca-agent:
    image: rca-agent:v1.2.3
    container_name: rca-agent
    dns:  
     - 8.8.8.8

    environment:
      GOOGLE_API_KEY: "your google gemini api key"
      NATS_URL: "nats://nats:4222"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "your_password"
      NATS_SUBJECT: "traffic.alert"
      SLACK_WEBHOOK_URL: "YOUR SLACK WEBHOOK"

    depends_on:
      - nats
      - neo4j

    networks:
      - kind

volumes:
  nats_data:
  neo4j_data:

networks:
  kind:
    external: true